name: BOT 1 Daily Scraper

on:
  schedule:
    # 台灣時間 19:30 (UTC 11:30)，每週一至週五執行
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # 允許手動點擊按鈕執行

permissions:
  contents: write

jobs:
  run-bot1:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝依賴套件
        run: pip install -r requirements.txt

      - name: 4. 執行 BOT 1 抓取漲停股
        run: python bot1_scraper.py

      - name: 5. 將 SQLite 資料庫 Commit 存回 GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "QuantBot"
          git add data/quant.db
          # 如果資料庫有更新，就自動推播儲存
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: BOT 1 盤後資料更新" && git push)
